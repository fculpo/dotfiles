[tools]
# Tools with a `postinstall` write their zsh completion into
# ~/.local/share/zsh/site-functions (on $fpath via .zshrc). It runs whenever a
# version is newly installed, so upgrades and fresh machines both get current files.
"npm:@bitwarden/cli" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:openwiki" = "latest"
bat = "latest"
bun = "latest"
delta = "latest"
flux2 = { version = "2.6.4", postinstall = "flux completion zsh > $HOME/.local/share/zsh/site-functions/_flux" }
fzf = "latest"
gh = { version = "latest", postinstall = "gh completion -s zsh > $HOME/.local/share/zsh/site-functions/_gh" }
git-lfs = "latest"
github-cli = "latest"
glab = "latest"
lsd = "latest"
node = "lts/krypton"
ripgrep = "latest"
ruby = "4.0"
usage = "latest"
uv = { version = "latest", postinstall = "uv generate-shell-completion zsh > $HOME/.local/share/zsh/site-functions/_uv && uvx --generate-shell-completion zsh > $HOME/.local/share/zsh/site-functions/_uvx" }
zoxide = "latest"
direnv = "latest"
yazi = "latest"
tanka = "latest"
yq = "latest"
eza = "latest"
# promoted from brew (CLI tools, dedupe with Homebrew)
age = "latest"
awscli = "latest"
cosign = "latest"
gitleaks = "latest"
go-jsonnet = "latest"
grype = "latest"
hadolint = "latest"
helm = { version = "latest", postinstall = "helm completion zsh > $HOME/.local/share/zsh/site-functions/_helm" }
jq = "latest"
jb = "latest"
k6 = "latest"
pre-commit = "latest"
shellcheck = "latest"
syft = "latest"
trivy = "latest"
# Regenerates the herdr agent skill from the freshly installed binary.
herdr = { version = "latest", postinstall = "herdr-skill-sync" }
nono = "latest"
markdownlint-cli2 = "latest"
"github:gastownhall/beads" = "latest"
azure-kubelogin = "latest"
azure-cli = { version = "latest", uvx_args = "--prerelease=allow" }
kubectl = { version = "1.35", postinstall = "kubectl completion zsh > $HOME/.local/share/zsh/site-functions/_kubectl" }
rclone = "latest"
rust = "latest"

[settings]
# Recompute the env only on cd, not on every prompt: a full hook-env costs ~50ms
# with this many tools. After editing a mise.toml in place, cd or run
# `mise hook-env --force` to pick it up.
hook_env.chpwd_only = true
idiomatic_version_file_enable_tools = ["rust"]

[settings.npm]
package_manager = "bun"

[settings.ruby]
compile = false
